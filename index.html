/* ===== ADRIAN (grappler, v2): chain whip, Grapple, Chain Tether, Cyclone, and MOMENTUM =====

//   each boss once and clears enemy shots, and leaves a QUAKE that keeps hurting bosses standing in it for 1.8 s. A full charge is a BIG FLOP:
//   +50% damage, +20% size and two extra aftershock rings.
// Q, Pet Rocks: summon rocks that orbit and block shots (10 s). Press Q again to THROW them: they fly out, then home in on the boss.
// E, Sponge Squad: SpongeBob follows him for 7 s and throws Krabby Patties at the boss. Every 4th patty is a heal that flies to the weakest ally.
// R, Eureka!: think for 0.6 s, then a big burst clears shots, hurts bosses, throws a stone ring and heals him. BIG BRAIN for 7 s: flop charges
//   3x faster, no recovery, +40% flop damage.

function stepTerryWorld(dt){
 if(!S.tc)S.tc=[];
 if(!S.tc.length)return;
 S.tc=S.tc.filter(c=>{

  c.t+=dt;c.cd=Math.max(0,c.cd-dt);c.rot+=dt*12;

  const tg=bossTargetAt(c.x,c.y,30);
  if(tg&&c.cd<=0){

// A hop target that is not on top of him and keeps a comfortable distance from the nearest player (his wandering between games).
function drlSpot(near){let best=null,bs=-1e9;for(let i=0;i<8;i++){const c={x:rnd(110,850),y:rnd(175,430)};let s=Math.min(260,dist(c.x,c.y,S.bs.x,S.bs.y))*.3+rnd(0,40);if(near)s-=Math.abs(dist(c.x,c.y,near.x,near.y)-260)*.5;if(s>bs){bs=s;best=c}}return best}
// Red Light: his bullets stop dead (harmless statues, the engine's own freeze flag) while the light is red, then carry on at green.
function drlFreeze(q,dt){const b=S.bs;if(!b)return;if(b.light===3){if(!q.fz){q.fz=1;q.ox=q.vx;q.oy=q.vy}q.frz=1;q.vx=0;q.vy=0}else if(q.fz){q.fz=0;q.frz=0;q.vx=q.ox;q.vy=q.oy}}
// Pinball: balls bounce off the walls (the engine's bounce) and off the bumpers, speeding up a little each time.
function drlBall(q,dt){for(const m of (S.drlBump||[])){const dx=q.x-m.x,dy=q.y-m.y,d=Math.hypot(dx,dy),rr=m.r+q.r*.9;if(d<rr&&d>0){const nx=dx/d,ny=dy/d,dot=q.vx*nx+q.vy*ny;if(dot<0){q.vx-=2*dot*nx;q.vy-=2*dot*ny;const sp=Math.hypot(q.vx,q.vy),ns=Math.min(470,sp*1.08);q.vx*=ns/sp;q.vy*=ns/sp;fx(['p',q.x,q.y,5,'#b98cff',160,.3,4,'spark']);X('pop')}q.x=m.x+nx*rr;q.y=m.y+ny*rr}}}

// Shadow dash: the arrival spot is marked first (his sprite drops into it), then he vanishes, reappears there and slashes.
function stepDash(o){
 const q=o.boss;
 if(!q||q.hp<=0){q.vanish=0;q.inv=0;return false}
 q.busy=Math.max(q.busy||0,.2);
 if(o.t<.5){q.vanish=1;q.inv=1;return true}
 if(!o.done){o.done=1;q.vanish=0;q.inv=0;q.x=o.ax;q.y=o.ay;const tg=nearest(q.x,q.y);if(tg)q.a=Math.atan2(tg.y-q.y,tg.x-q.x);X('whoosh');fx(['r',q.x,q.y,70,'#2a5bff']);fx(['r',q.x,q.y,36,'#ff1c3a']);fx(['s',8]);secBurst(q.x,q.y,'#2a5bff',20,1)}
 if(!o.slashed&&o.t>=.7){o.slashed=1;s7add({k:'arc',boss:q,t:0,x:q.x,y:q.y,a:q.a,a0:q.a-.95,a1:q.a+.95,half:.95,r:140,tele:.1,dur:.26,hit:{},dmg:24})}
 return o.t<1.1;
}

const SC_TF=2.6; // transform length (s)
function startSecretCut(){
 S.secSeen=1;S.st='secretcut';S.bs.inv=1;S.pr=[];S.wr=[];S.zn=[];S.s7=[];S.dlg=null;
 const m=S.tri[1],w=S.bs,j=S.tri[0];m.inv=1;m.busy=0;
 // Stage the scene on screen: Will centre-right, Jackson far right, Mason enters from the left.
 w.x=560;w.y=255;j.x=770;j.y=300;m.x=190;m.y=400;
 const side=m.x<w.x?-1:1,tx=w.x+side*78;
 S.sc={t:0,sx:m.x,sy:m.y,wx:w.x,wy:w.y,jx:j.x,jy:j.y,tx,ty:w.y+34,tx2:j.x+(tx>j.x?78:-78),ty2:j.y+34,
   ms:-1,who:0,wf:0,jf:0,said:0,tfOn:0,tf:0,tfT:0,tfB:0,hitW:0,hitJ:0,impW:0,impJ:0};
 fx(['f','#ffffff']);X('boom');

function secSlam(x,y){X('boom');fx(['s',16]);fx(['f','#ff1c3a']);fx(['r',x,y,130,'#ff1c3a']);fx(['p',x,y,30,'#2a5bff',360,.8,5]);fx(['p',x,y,24,'#fff',300,.6,4])}
function secStrikeFx(x,y){X('stab');fx(['s',12]);fx(['r',x,y,90,'#fff']);fx(['p',x,y,26,'#ff1c3a',340,.55,5,'pixel']);for(let k=0;k<16;k++){const a=rnd(0,PI*2);fx(['p',x+Math.cos(a)*rnd(10,60),y+Math.sin(a)*rnd(10,60),3,k%2?'#050207':'#ff1c3a',rnd(200,420),.5,5,'pixel'])}}
function stepSecretCut(dt){
 const c=S.sc,m=S.tri[1],w=S.bs,j=S.tri[0];c.t+=dt;
 // 1) Mason walks over to Will.
 if(c.t<=.95){const e=secEase(c.t/.95);m.x=c.sx+(c.tx-c.sx)*e;m.y=c.sy+(c.ty-c.sy)*e}
 // 2) Strike on Will (Will is already down to his last HP).
 if(!c.hitW&&c.t>=1.05){c.hitW=1;c.ms=0;c.who=0}
 // 3) Mason walks over to Jackson.
 if(c.t>=2.45&&c.t<3.35){const e=secEase((c.t-2.45)/.9);m.x=c.tx+(c.tx2-c.tx)*e;m.y=c.ty+(c.ty2-c.ty)*e}
 else if(c.t>=3.35){m.x=c.tx2;m.y=c.ty2}
 // 4) Strike on Jackson.
 if(!c.hitJ&&c.t>=3.6){c.hitJ=1;c.ms=0;c.who=1}
 if(c.ms>=0){
  c.ms+=dt/.55;
  if(c.who===0&&!c.impW&&c.ms>=.45){c.impW=1;secStrikeFx(w.x,w.y);secSlam(w.x,w.y)}
  if(c.who===1&&!c.impJ&&c.ms>=.45){c.impJ=1;secStrikeFx(j.x,j.y);secSlam(j.x,j.y)}
  if(c.ms>=1)c.ms=-1;
 }
 // 5) Each one collapses after the hit.
 if(c.impW&&c.wf<1)c.wf=Math.min(1,c.wf+dt/1.1);
 if(c.impJ&&c.jf<1)c.jf=Math.min(1,c.jf+dt/1.1);
 // 6) Will's last words, from the ground.
 if(!c.said&&c.t>=5.2&&c.jf>=1){c.said=1;const L=[["Will","your not mason"]];S.dlg={L,i:0,t:0,dur:dur(L[0]),noSkip:1}}
 else if(c.said&&S.dlg){const D=S.dlg;D.t+=dt;if(D.t>=D.dur)S.dlg=null}
 // 7) Mason turns dark, then the transform takes over.
 if(c.said&&!S.dlg&&!c.tfOn){c.tfOn=1;c.tfT=c.t;X('phase');fx(['f','#ff1c3a'])}
 if(c.tfOn){
  c.tf=Math.min(1,(c.t-c.tfT)/SC_TF);
  if(c.tf>=.4&&!c.tfB){c.tfB=1;X('boom');fx(['s',14]);fx(['r',m.x,m.y,220,'#ff1c3a'])}
  if(c.tf>=1)secTransform(m);
 }
}

  else if(t==='webrtc')jFail('ice',(e&&e.message)||'');
  else if(!JN.signalOk&&/network|server|socket|ssl|disconnect|id/.test(t))jFail('signal',t);
  else if(!V)jFail('unknown',t);
  else jLog('peer error: '+t);
 });
}

// ===== CHAT (online lobby + in-game) =====
// The host is the only authority. Clients send {t:'chat',m,k}; the host cleans the text, rate-limits it, stamps the real
// sender id and name, then relays {t:'chat',e} to everyone. Text is typed into a hidden <input> (so paste, selection and
// IME work) and drawn on the canvas. Enter or / opens it, Enter sends, Esc cancels. Commands: /me /mute /unmute /clear /help.
const CHAT_MAX=160,CHAT_COL=['#ffd34a','#7fd8ff','#ff9a7a','#9dff9a','#e4a0ff','#ffb3d9','#a8b8ff','#ffe08a'];
const CI=document.createElement('input');
CI.type='text';CI.maxLength=CHAT_MAX;CI.autocomplete='off';CI.spellcheck=false;CI.setAttribute('autocapitalize','off');CI.setAttribute('aria-label','Chat message');
CI.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none;z-index:-1';
document.body.appendChild(CI);
const chatClean=s=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,' ').replace(/\s+/g,' ').trim().slice(0,CHAT_MAX);
const chatOnline=()=>scr==='game'&&(host?!!room:!!(conn&&conn.open));
const chatLobby=()=>!!(V&&V.st==='lobby');
const chatCol=id=>{if(id==='host')return CHAT_COL[0];let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return CHAT_COL[1+h%(CHAT_COL.length-1)]};
function chatReset(){CHAT.log=[];CHAT.seq=0;CHAT.unread=0;CHAT.newBelow=0;CHAT.scroll=0;CHAT.rl={};CHAT.muted={};CHAT.typing=0;CHAT.open=0;try{CI.blur();CI.value=''}catch(e){}}
// k: 0 = chat, 1 = /me action, 2 = system line
function chatAdd(e,quiet){
 e.ts=Date.now();e.i=++CHAT.seq;e.tm=new Date(e.ts).toTimeString().slice(0,5);if(quiet)e.q=1;
 CHAT.log.push(e);if(CHAT.log.length>80)CHAT.log.shift();
 if(quiet||CHAT.muted[e.f])return;
 if(CHAT.scroll>0)CHAT.newBelow++;
 if(e.f!==me&&e.k!==2){if(chatLobby()&&!CHAT.open)CHAT.unread++;sfx('click')}}
function chatLocal(m){chatAdd({f:'',n:'',m,k:2})}
function chatBroadcast(e){const o={f:e.f,n:e.n,m:e.m,k:e.k};Object.values(conns).forEach(c=>{if(c.open)c.send({t:'chat',e:o})})}
function chatSys(text){const e={f:'',n:'',m:chatClean(text),k:2};if(!e.m)return;chatAdd(e);chatBroadcast(e)}
function chatHostPost(id,raw,kind){
 const text=chatClean(raw);if(!text||!S)return false;
 const p=S.pl[id];if(!p)return false;
 const now=performance.now(),r=(CHAT.rl[id]=(CHAT.rl[id]||[]).filter(t=>now-t<6000));
 if(r.length>=5){const msg='Slow down! You are sending messages too quickly.';if(id==='host')chatLocal(msg);else if(conns[id]&&conns[id].open)conns[id].send({t:'chat',e:{f:'',n:'',m:msg,k:2}});return false}
 r.push(now);
 const e={f:id,n:String(p.name||'Player'),m:text,k:(kind|0)===1?1:0};
 chatAdd(e);chatBroadcast(e);return true}
function chatRecv(o){if(!o||typeof o.m!=='string')return;const m=chatClean(o.m);if(!m)return;const k=(o.k|0)===1?1:(o.k|0)===2?2:0;chatAdd({f:String(o.f||'').slice(0,60),n:String(o.n||'').slice(0,24),m,k})}
function chatHistOut(){return CHAT.log.filter(e=>!e.local).slice(-25).map(e=>({f:e.f,n:e.n,m:e.m,k:e.k}))}
function chatHistIn(h){CHAT.log=[];(Array.isArray(h)?h:[]).slice(-25).forEach(o=>{if(!o||typeof o.m!=='string')return;const m=chatClean(o.m);if(!m)return;chatAdd({f:String(o.f||'').slice(0,60),n:String(o.n||'').slice(0,24),m,k:(o.k|0)===1?1:(o.k|0)===2?2:0},true)})}
function chatEmit(text,kind){if(host)chatHostPost('host',text,kind);else send({t:'chat',m:text,k:kind})}
function chatQuick(t){if(chatOnline())chatEmit(t,0)}
function chatMute(arg,on){
 const q=String(arg||'').toLowerCase();
 if(!q){chatLocal('Usage: /'+(on?'mute':'unmute')+' <player name>');return}
 const pl=((V&&V.pl)||[]).filter(p=>p.id!==me&&p.name&&p.name.toLowerCase().startsWith(q));

 {id:'domain-music-cutscene',title:'Domain Music and New Cutscenes',date:'Nov 14, 2026',sub:'Each mastery domain has its own song, and both domain cutscenes are rebuilt.',items:[

 {id:'new-upgrades',title:'Eight New Upgrades',date:'Nov 14, 2026',sub:'Eight new upgrades, including two cursed ones with heavy drawbacks.',items:[

 {id:'upgrade-screen',title:'New Upgrade Screen',date:'Nov 14, 2026',sub:'The upgrade picker has been redesigned with new transitions and effects.',items:[

 {id:'mastery-intro',title:'Character Mastery, Crimson Rush and a New Intro',date:'Nov 14, 2026',sub:'Prime Zach and The Coolest Guy get mastery quests, new move sets and domain expansions.',items:[
  ['NEW','Mastery for Prime Zach and The Coolest Guy: finish all 8 quests for each hero to unlock it. Progress saves on this device.'],
  ['NEW','Quest page: open it from the hero card in the lobby with VIEW QUESTS to see every quest and your progress.'],
  ['NEW','Mastery HUD: a quest panel top-right during fights (click the header to collapse it) and a meter for Cursed Energy or Cool Rating.'],
  ['NEW','Prime Zach: Knife Fan (Q) throws 5 knives in a spread. Knife Orbit (E) circles knives around you, and Crimson Rush (R) is the renamed Lunge.'],
  ['NEW','The Coolest Guy: Skyfall Brick (Q), Shades Beam (E, hold to charge), Cool Slide (R) with a shadow clone, and Cool Hour (F).'],
  ['NEW','Domain expansions: Knife Extravaganza for Prime Zach and Cool Hour for The Coolest Guy, each with a cutscene. Domains slow the boss music and distort it.'],
  ['NEW','Domain Clash: if you use a domain during Xiao Long Bao\'s domain, Evil Zach challenges you to a button-mash. Win to stun him.'],
  ['CHANGED','The intro now plays every time you open the game. Click or press any key to skip it, and press I on the title screen to replay it.'],
  ['CHANGED','Title screen: the intro has a cinematic logo entrance, the personal-bests ticker no longer overlaps the controls hint, and the sound prompt moved to the bottom right.']]},
 {id:'sandbox-revive',title:'Sandbox Mode and Better Revives',date:'Nov 13, 2026',sub:'A sandbox for trying bosses and upgrades, and clearer revive effects.',items:[
  ['NEW','Sandbox mode: open it from the title screen to pick any boss and any upgrades, then start a run. Sandbox runs do not save ghosts or Zach Coins.'],
  ['NEW','During a sandbox run, the pause menu has a SANDBOX button to summon a different boss or add upgrades mid-run.'],
  ['CHANGED','Revives have a clearer progress ring with glowing sparks, rescue beams from nearby teammates, a rescuer count, a burst of light when someone is revived, and a glow on downed players.']]},
 {id:'minions-replay',title:'Smaller Park Minions and Replay Intro',date:'Nov 13, 2026',sub:'The Park minions are smaller, and the title intro can be replayed.',items:[
  ['CHANGED','The Park minions are 50% smaller. Their hitboxes are unchanged.'],
  ['NEW','Settings > Effects > Menus > Replay Intro plays the title screen intro again.']]},
 {id:'title-v2',title:'Title Screen Redesign',date:'Nov 13, 2026',sub:'A new title screen, a legacy option, Butters, and ghost resets.',items:[
  ['NEW','The title screen has a boss trailer behind it: the boss arenas cycle, with a faint boss silhouette and mouse parallax.'],
  ['NEW','The BOSS RUSH logo has a shine that sweeps across it, a slight wobble, and a hidden surprise if you click it five times.'],
  ['NEW','Hero of the Day: a featured hero that changes each day. Click it to open that hero in the skin shop.'],
  ['NEW','Last run card: shows your most recent run with a REPLAY link that starts a solo run at that boss.'],
  ['NEW','Personal bests ticker along the bottom of the title screen, showing your fastest time for each boss.'],
  ['NEW','Buttons lift when hovered and play a sound. You can also move between buttons with the arrow keys and press Enter.'],
  ['NEW','Seasonal title screens: pumpkins in October, and snow in December and January.'],
  ['NEW','A short intro plays the first time you open the game. Click or press any key to skip it.'],
  ['NEW','Settings > Effects > Legacy Title Screen brings back the original title screen layout.'],
  ['NEW','Settings > Effects > Saved Data > Reset Ghost Races deletes every saved ghost race. Your coins, skins and stats are kept.'],
  ['CHANGED','The Park: Butters is now the medkit minion, and Jameson in The Park is 25% smaller.']]},
 {id:'park-shafiq-join',title:'The Park, Shafiq and a Better Join Screen',date:'Nov 13, 2026',sub:'Two new skins, a live join screen and clearer online join diagnostics.',items:[
  ['NEW','The Park skin for Jameson Lee Cooper (Legendary, 500 Zach Coins): Cartman is Jameson, Kyle is the sword minion, Stan is the bow minion and Kenny is the kamikaze minion.'],
  ['NEW','Shafiq skin for Bomb Barry (Common, 120 Zach Coins). Shafiq is used for every Bomb Barry pose, and his thrown bomb.'],
  ['NEW','The join screen is now a live fight: the real boss arenas, bosses, heroes and attack art, with a boss preview, a progress bar and rotating tips.'],
  ['NEW','If joining fails, a diagnosis shows which step failed (library, matchmaking, link to host or game state), a network probe, a TRY AGAIN button and COPY REPORT to send to someone helping you.'],
  ['CHANGED','Online joins add a TLS relay fallback (port 443), retry in relay-only mode, and support ?signal=your-host to use your own matchmaking server.']]},
 {id:'fella-remake',title:'Fella Remake',date:'Nov 11, 2026',sub:'Boss 6 now has outs and a tagged-out damage window.',items:[
  ['NEW','Fella gets winded after his slide, slam and homer if you dodge them: TAGGED OUT, he takes +40% damage. Each one is an out on the scoreboard, and THREE OUTS leaves him exposed for much longer.'],
  ['NEW','Run the Bases: the diamond bases blow up in sequence. Pickoff: a fast throw down a lane at every player.']]},
 {id:'ghost-races',title:'Ghost Races and Boss Movement',date:'Nov 11, 2026',sub:'Ghosts were remade, and bosses move much better.',items:[
  ['NEW','Ghost races were remade. Your fastest clear of each boss (per hero and difficulty) is saved and races you as a ghost of you AND a ghost boss, with a path preview, hit flashes and a marker on the boss bar.'],
  ['NEW','A live comparison under the boss bar shows the ghost time and how far ahead or behind you are at the same boss HP. A new PB is announced when you win.'],
  ['NEW','The lobby shows your ghost PB for the chosen start boss and has a GHOST on/off toggle. Old ghost data is no longer used.'],
  ['CHANGED','Bosses now roam: they pick waypoints away from you, ease into moves, back off if crowded, speed up each phase and plant their feet before attacking. Bao, UnCoolguy16, Spong and Darrel each move differently, and bosses lean into their movement.']]},
 {id:'unlocks-adrian',title:'Unlocks, Skip Costs and Adrian',date:'Nov 10, 2026',sub:'Heroes cost Zach Coins, skipping bosses costs Zach Coins, and Adrian was reworked.',items:[
  ['CHANGED','Only CoolGuy15 and Zach start unlocked. Unlock Jay (100), Terry (125), Pat (150), Adrian (175), Jam (200) and Bomb (225) with Zach Coins.'],
  ['CHANGED','Starting on a later boss costs 25 Zach Coins per boss skipped (boss 2 = 25, boss 3 = 50, ...).'],
  ['CHANGED','Adrian: M1 is now a weaker stick swing using the stick sprite, and momentum only builds from landing hits, drains after 1.5s and halves when hit.'],
  ['NEW','Adrian: Cyclone is replaced by Rev Up, a dash with i-frames that clears nearby boss shots and gives 45% momentum.']]},
 {id:'lobby-title-pass',title:'Lobby, Title Screen and Skins',date:'Nov 10, 2026',sub:'A cleaner lobby and title screen, a data reset, and new skin rules.',items:[
  ['CHANGED','All saved data (progress, Zach Coins, skins, settings, stats) was reset one time on every device.'],
  ['CHANGED','Coolguy15 and Zach skins are now free to equip. Every other skin must be bought with Zach Coins.'],
  ['NEW','Lobby: a compact hero roster with a big hero card showing weapon and ability descriptions, player slots at the bottom, and tidier room settings. The start boss now shows its name.'],
  ['NEW','Title screen: menu grouped into Play, Customise, Progress and More, a profile card, a Daily Challenge shortcut and rotating tips.']]},
 {id:'adrian-remake',title:'Adrian Remake: The Grappler',date:'Nov 8, 2026',sub:'Adrian is no longer a boomerang trapper. He is a close-range chain fighter who never stops moving.',items:[
  ['NEW','Chain Whip (M1): a wide, short sweep that also cuts down boss shots. Hit with the TIP of the chain for a CRACK: x1.6 damage and extra momentum.'],
  ['NEW','MOMENTUM: builds while you move and as you land hits, up to +40% damage and +20% speed. At 100% you enter OVERDRIVE for 5s (+25% damage, double cracks). Standing still bleeds it, and getting hit knocks a chunk off.'],
  ['NEW','Grapple (Q): hook the boss and zip in for a slam. If you miss, you zip across the arena instead (with i-frames) and get half the cooldown back.'],
  ['NEW','Chain Tether (E): chain onto the boss for 5s. It takes +20% damage from everyone and your whip hits heal you. Pull too far away and the chain snaps.'],
  ['NEW','Cyclone (R): spin the chain for 1.2s, hitting everything around you and cutting down boss shots.'],
  ['CHANGED','Removed: boomerang, Snap Trap, Decoy Echo, Gum Wall and Last Stand. HP 110 to 120, and Grapple/Tether/Cyclone cooldowns are 6s / 11s / 10s.'],
  ['FIXED','The Jameson hero card sentence about Squad Upgrades read badly after the last change. It reads properly now.']]},
 {id:'jam-nerf',title:'Jameson Lee Cooper: Balance Pass',date:'Nov 8, 2026',sub:'A slight nerf to Jameson. He is still a swarm, just a little less overwhelming.',items:[
  ['CHANGED','Base HP 70 to 64, and a little slower (speed 240 to 232).'],
  ['CHANGED','Squad upgrades: Heavy Hands +25% to +20% minion damage, Tough Stuff +30% to +25% minion HP, Shield Drills 12 to 10 HP shields, Fast Factory 20% to 15% faster summons, Big Boom +35% to +30% blast radius, Long Shifts +10s to +8s.'],
  ['CHANGED','Squad upgrades now open every 1400 minion damage for the first one, then each next upgrade needs 500 more damage than the last (1400, 1900, 2400...).']]},
 {id:'darrel-games',title:'Darrel Remake 2: Party Games',date:'Nov 8, 2026',sub:'Every Darrel move was replaced. Each one is a party game with its own rule.',items:[
  ['NEW','RED LIGHT, GREEN LIGHT: on red every bullet freezes and anyone who moves gets busted. MUSICAL CHAIRS: chairs orbit, one is taken away each round, and you must be sitting on one when the music stops.'],
  ['NEW','PASS THE PARCEL: touch a gift before your fuse runs out and the blast goes back at Darrel for damage. BALLOON PUMP: balloons inflate while drifting after you. CUT THE CAKE: every other slice is hot, and the cut changes.'],
  ['NEW','BLOW OUT THE CANDLES: wind shoves you into a wall of flames, so run into it. DARREL SAYS: memorise a colour sequence, then do it with no hints. THE FLOOR IS LAVA: tiles turn to lava for good.'],
  ['NEW','PIN THE TAIL: he leads your movement. PINBALL PARTY: balls ricochet off bumpers, which also make cover. JUMP ROPE: stay in the hub while the rope spins and reverses. PARTY GAME MEDLEY: three games in a row, then he crashes.'],
  ['NEW','SURPRISE PARTY: the lights go out and party poppers charge in the dark. If one hits you, a cutscene plays with your character, their name and their own gift. Dodge them all and the surprise is ruined, so he crashes.'],
  ['CHANGED','The sugar meter and crash work as before: each game adds sugar, a full meter means a crash and +35% damage. A traffic light and wind streaks now show on the arena.']]},
 {id:'drivethru-switch',title:'Drive-Thru: Switch Lanes',date:'Nov 8, 2026',sub:'The Drive-Thru attack no longer lets you stand between the lanes.',items:[
  ['CHANGED','Each belt is now a full band of burgers instead of a thin line. One open lane is marked in green with a marker at its entry end.'],
  ['NEW','The open lane SWITCHES to the next belt mid-attack. The new lane glows green and the old one glows yellow about a second before it happens. Phase 1 has one switch, phase 2 two, phase 3 three, and they come faster.']]},
 {id:'zach-round2',title:'Evil Zach Rematch: Round Two',date:'Nov 8, 2026',sub:'Stronger, faster and meaner. The first fight comes back upgraded, and a storm rolls in.',items:[
  ['NEW','COUNTER STANCE: Zach raises his blade inside a silver ring. Shoot him during it and your own shots are reflected back at you, and he answers with a counter burst. Hold your fire and reposition.'],
  ['NEW','DOMAIN EXPANSION: FINAL ORDER. A dome closes over the arena. Stand inside a green window or you are pulled into his domain. Every character gets their own cutscene: a custom order, stamp and quote. If everyone makes it, the order is cancelled and he is stunned.'],
  ['NEW','The first fight returns as 2.0 versions: Clone Circle, Knife Whirl, Backstab, Ricochet, Mirror Dash, Final Cut, Fakeout and Counterfeit Rush, plus upgraded Fan, Lunge, Burgers, Juggle, Rain, Spiral, Shadow Slash and Copycat.'],
  ['CHANGED','Knife Combo is now a five-hit chain (slash, reverse slash, stab, spin, heavy stab) that closes in faster and ends in a knife burst. Black Flash hits harder and winds up faster. One or both are in almost every meal.'],
  ['CHANGED','Everything hits harder (+20% to +40% by phase) and faster, he pokes with knives the whole time, interludes and closed windows are shorter (closed bonus is now +25%) and dodge charges come back sooner. HP 12,000 to 15,000.'],
  ['CHANGED','Night storm arena: layered rain, lightning that gets more frequent every phase, wet floor sheen and puddle ripples, drifting fog, lamp flicker, a rim light on Zach and a colour shift from teal to violet to crimson.'],
  ['CHANGED','New rematch dialogue that remembers the first fight.']]},
 {id:'updlog',title:'Update Log',date:'Nov 8, 2026',sub:'You are reading it.',items:[
  ['NEW','Update Log on the title screen. Scroll with the mouse wheel or drag. ESC goes back.'],
  ['NEW','A NEW badge shows on the button whenever there is an update you have not opened yet.']]},
 {id:'zach-rematch',title:'Evil Zach Rematch Remake',date:'Nov 8, 2026',sub:'Boss 9 is now a drive-thru duelist with a real rhythm: order, dodge, closed.',items:[
  ['NEW','Combo meals: Zach takes an order, a fixed 2 to 4 move sequence shown on the menu board on the wall with the current move lit. Phase 1 meals are 2 moves, phase 2 are 3, phase 3 are up to 4. Black Flash only ever closes a meal.'],
  ['NEW','Dodge charges: three diamonds beside him. Every dodge spends one and they come back slowly. Out of charges, he cannot dodge.'],
  ['NEW','CLOSED window after every meal: he stands still and takes +30% damage while his dodges refill.'],
  ['NEW','Order Up (numbered tickets blast in order) and Heat Lamp (two of the three belts burn, the green one is safe).'],
  ['CHANGED','Knife Lunge: the lane matches the real hitbox and turns white when the aim locks, before he launches.'],
  ['CHANGED','Knife Hook can be sidestepped and only pulls you in if it connects. Shadow Slash and Knife Spiral now warn before they hit, and the Satchel crosshair matches the blast.'],
  ['CHANGED','Second Helping still heals 8%, but hitting him for about 3.5% of his max health while he chews interrupts it.'],
  ['CHANGED','HP 13,333 to 12,000. New rainy drive-thru night arena, menu board and dialogue for every party size.'],
  ['FIXED','The old rematch picked the slash combo or Black Flash about 80% of the time, so most of its menu never showed up. Meals now use the whole menu.']]},
 {id:'darrel',title:'Darrel Remake',date:'Nov 8, 2026',sub:'Boss 8 is a party that never sits still, with a sugar meter that decides when he crashes.',items:[
  ['NEW','Sugar meter: every attack adds sugar. When it is full Darrel trips into a SUGAR CRASH and takes +35% damage for a few seconds. The meter is on the wall.'],
  ['NEW','Every attack is announced by name. Phase 1: Belly Flop, iPad Tag, Happy Showers, Party Horn, Goo Goo, Zoomies. Phase 2 adds Candle Ring, Twirl, Pinata, Cake Drop, Disco Floor. Phase 3 adds Balloon Party, Conga Line and the Birthday Finale.'],

const RVB=[];
function drawRevBursts(t){
 const dt=Math.min(.05,Math.max(0,t-(drawRevBursts.last||t)));drawRevBursts.last=t;
 RVB.forEach(b=>b.l-=dt);
 for(let i=RVB.length-1;i>=0;i--)if(RVB[i].l<=0)RVB.splice(i,1);
 for(const b of RVB){
  const k=1-b.l/b.max,a=Math.max(0,b.l/b.max);
  g.save();g.globalCompositeOperation='lighter';
  const cg=g.createLinearGradient(0,b.y-260*k,0,b.y);cg.addColorStop(0,'rgba(125,255,160,0)');cg.addColorStop(1,'rgba(200,255,220,'+(.5*a)+')');
  g.fillStyle=cg;g.fillRect(b.x-26*(1-k*.5),b.y-260*k,52*(1-k*.5),260*k);
  for(let r=0;r<2;r++){const rk=Math.min(1,k*1.4-r*.25);if(rk>0){g.strokeStyle='rgba(125,255,160,'+(a*.9)+')';g.lineWidth=5*a+1;g.beginPath();g.ellipse(b.x,b.y+10,20+rk*110,8+rk*34,0,0,PI*2);g.stroke()}}
  for(let i=0;i<14;i++){const an=i*2.399,rad=(10+(i%5)*12)*(1-k*.3),x=b.x+Math.cos(an+k*4)*rad,y=b.y-k*160*(.4+(i%4)*.2)+Math.sin(an)*4;g.fillStyle='rgba(190,255,214,'+(a*.9)+')';g.beginPath();g.arc(x,y,2+(i%3),0,PI*2);g.fill()}
  g.restore();
 }
}

 g.save();g.globalCompositeOperation='lighter';
 const rg=g.createRadialGradient(o.x,o.y+20,8,o.x,o.y+20,70);rg.addColorStop(0,'rgba(125,255,160,'+(.12+.1*pulse)+')');rg.addColorStop(1,'rgba(125,255,160,0)');

function drawRevive(p,o){
 const t=performance.now()/1000,k=Math.max(0,Math.min(1,p.rvp)),pulse=.5+.5*Math.sin(t*(6+k*14));
 const mates=((V&&V.pl)||[]).filter(q=>q&&!q.dead&&q.id!==p.id&&Math.hypot(q.x-p.x,q.y-p.y)<50);

 g.setLineDash([8,10]);g.lineDashOffset=-t*60;g.lineWidth=2.5;g.strokeStyle='rgba(125,255,160,.7)';
 mates.forEach(m=>{g.beginPath();g.moveTo(m.x,m.y-24);g.lineTo(o.x,o.y);g.stroke()});

 // orbiting sparks that tighten as the revive completes

 g.fillStyle=band(70,[[0,'rgba(255,70,100,0)'],[.5,'rgba(255,80,115,'+(.62*flick).toFixed(3)+')'],[1,'rgba(255,70,100,0)']]);g.fillRect(cx,y-35,len,70);
 g.fillStyle=band(30,[[0,'rgba(255,190,205,0)'],[.5,'rgba(255,225,235,'+(.9*flick).toFixed(3)+')'],[1,'rgba(255,190,205,0)']]);g.fillRect(cx,y-15,len,30);
 // Chromatic fringes around a thick core.
 g.fillStyle='rgba(255,40,60,'+(.35*flick).toFixed(3)+')';g.fillRect(cx,y-11,len,4);

 g.fillStyle='rgba(255,235,240,'+(.95*flick).toFixed(3)+')';g.fillRect(cx,y-7,len,14);

 // Heat shimmer: five wavy lines that ripple along the beam.

 // Sparks drift off the beam.

 g.globalAlpha=a;
 // Lightning arcs jump from the beam to the lane edges.

 // Leading edge: a bright flare and a crackle.
 const fg=g.createRadialGradient(ex,y,0,ex,y,70);fg.addColorStop(0,'rgba(255,255,255,'+(.95*flick).toFixed(3)+')');fg.addColorStop(.3,'rgba(255,90,120,.6)');fg.addColorStop(1,'rgba(255,30,70,0)');g.fillStyle=fg;g.beginPath();g.arc(ex,y,70,0,PI*2);g.fill();
 for(let i=0;i<8;i++){const an=zhsh(cs+i*7)*PI*2,L=18+zhsh(cs*3+i)*56;g.strokeStyle=i%2?'rgba(255,255,255,.95)':'rgba(255,90,120,.85)';g.lineWidth=2;g.beginPath();g.moveTo(ex,y);g.lineTo(ex+Math.cos(an)*L,y+Math.sin(an)*L*.7);g.stroke()}
 g.restore();
