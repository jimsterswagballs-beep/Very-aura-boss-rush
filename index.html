function drawHitboxes(v,t){if(!showHitboxes)return;g.save();g.setLineDash([5,4]);
 // Player body collision circles.

 // Boss bodies: a separate hitbox for each living enemy in the alliance fight.
 if(v.b&&v.b.hp>0)drawCircleHit(v.b.x,v.b.y,bossHitRadius(v.b),'rgba(255,70,70,1)');
 if(v.bs2&&v.bs2.hp>0)drawCircleHit(v.bs2.x,v.bs2.y,BOSS2_HIT_R,'rgba(255,70,170,1)');
 // Every moving projectile uses the same radius as its collision check.
 v.pr.forEach(q=>{const r=q[7]||Math.max(8,(q[5]||30)*.25);drawCircleHit(q[2],q[3],r,q[6]==='b'?'rgba(255,80,80,1)':'rgba(255,240,80,1)')});
 // Pickups and persistent area hazards.
 v.pk.forEach(([x,y])=>drawCircleHit(x,y,PICKUP_HIT_R,'rgba(80,255,100,1)'));v.zn.forEach(([x,y,r])=>drawCircleHit(x,y,r,'rgba(255,150,40,1)'));
 // Warning areas are shown as dashed collision previews.
 v.wr.forEach(([k,x,y,a,r])=>{g.strokeStyle='rgba(255,220,40,.95)';g.lineWidth=2;if(k==='c'){g.beginPath();g.arc(x,y,r,0,PI*2);g.stroke()}else if(k==='l'){g.save();g.translate(x,y);g.rotate(a);g.strokeRect(0,-30,1500,60);g.restore()}});

 if(v.b&&v.b.pipe!=null){[60,100,140,185].forEach(rad=>drawCircleHit(v.b.x+Math.cos(v.b.pipe)*rad,v.b.y+Math.sin(v.b.pipe)*rad,30+PLAYER_HIT_R,'rgba(255,80,80,1)'))}
 if(v.b&&v.b.mode==='charge'&&v.b.cdash>0)drawCircleHit(v.b.x,v.b.y,65+PLAYER_HIT_R,'rgba(255,60,60,1)');if(v.b&&v.b.sp)drawCircleHit(v.b.x,v.b.y,75+PLAYER_HIT_R,'rgba(255,60,60,1)');
 g.setLineDash([]);g.restore()}
